<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fdfdfd;
        --text-main: #4a4a4a;
        --card-bg: #fff;
        /* 파스텔 톤 색상 팔레트 */
        --s-bg: #FFD1DC; --s-bd: #ffb7b2;
        --p-bg: #FFFACD; --p-bd: #ffe680;
        --d-bg: #ADD8E6; --d-bd: #87CEFA;
        --f-bg: #C1E1C1; --f-bd: #98FB98;
        
        --correct: #d4edda; --wrong: #f8d7da;
    }

    /* === 1. 기본 레이아웃 === */
    body {
        font-family: 'Jua', 'Noto Sans KR', sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0; padding: 20px;
        display: flex; flex-direction: column; align-items: center;
        user-select: none; /* 드래그 방지 */
        overflow-x: hidden;
    }

    header {
        display: flex; justify-content: space-between; align-items: center;
        width: 100%; max-width: 1200px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }

    h1 { margin: 0; font-size: 2rem; color: #333; text-shadow: 2px 2px 0px #eee; display: flex; align-items: center; gap: 10px; }
    
    .secret-btn { font-size: 1.5rem; cursor: pointer; opacity: 0.5; transition: 0.3s; }
    .secret-btn:hover { opacity: 1; transform: rotate(90deg); }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
        padding: 8px 16px; border: none; border-radius: 20px;
        background: #eee; cursor: pointer; font-family: 'Jua'; font-size: 1rem;
        transition: transform 0.2s, background 0.2s;
        box-shadow: 0 4px 0 #ccc; display: flex; align-items: center; gap: 5px;
    }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn.primary { background: #FFAFBD; color: white; box-shadow: 0 4px 0 #ff8fa3; }
    .btn.alchemy { background: #e67e22; color: white; box-shadow: 0 4px 0 #d35400; }
    
    .search-box { padding: 8px 12px; border-radius: 20px; border: 2px solid #ddd; font-family: 'Jua'; }

    /* === 2. 주기율표 그리드 === */
    .table-container {
        display: grid;
        grid-template-columns: repeat(18, 1fr);
        grid-template-rows: repeat(10, 1fr);
        gap: 6px;
        max-width: 1400px; width: 100%;
        margin: 0 auto;
        padding: 10px;
        background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    /* 원소 카드 스타일 */
    .element {
        aspect-ratio: 4/5;
        background: var(--card-bg);
        border-radius: 8px;
        border: 2px solid transparent;
        padding: 4px;
        display: flex; flex-direction: column; justify-content: space-between;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        overflow: hidden;
    }
    .element:hover {
        transform: scale(1.15) translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        z-index: 100;
    }

    /* 블록별 색상 적용 */
    .bg-s { background: var(--s-bg); border-color: var(--s-bd); }
    .bg-p { background: var(--p-bg); border-color: var(--p-bd); }
    .bg-d { background: var(--d-bg); border-color: var(--d-bd); }
    .bg-f { background: var(--f-bg); border-color: var(--f-bd); }

    /* 카드 내부 텍스트 */
    .at-num { font-size: 0.8rem; opacity: 0.7; font-weight: bold; position: absolute; top: 4px; left: 6px; line-height: 1; }
    .mass { font-size: 0.7rem; opacity: 0.6; position: absolute; top: 4px; right: 6px; line-height: 1; letter-spacing: -0.5px; }
    .symbol { 
        font-size: clamp(1.2rem, 2.5vw, 2.2rem); font-weight: 800; text-align: center; 
        margin-top: 18px; margin-bottom: 2px; line-height: 1; 
    }
    .name-ko { 
        font-size: clamp(0.7rem, 1vw, 0.95rem); text-align: center; white-space: nowrap; 
        font-family: 'Noto Sans KR'; overflow: hidden; text-overflow: ellipsis;
        margin-bottom: 2px;
    }

    .empty { visibility: hidden; pointer-events: none; }
    .label-cell { display: flex; align-items: center; justify-content: center; font-size: 0.9rem; text-align: center; cursor: default; }

    /* 범례 */
    .legend { display: flex; gap: 15px; margin-top: 10px; font-size: 0.9rem; color: #555; flex-wrap: wrap; justify-content: center; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; border: 1px solid rgba(0,0,0,0.1); }

    /* === 3. 가리기(Hide) 모드 & 물음표 시각화 === */
    .question-mark {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem; color: rgba(0,0,0,0.2);
        font-weight: bold; display: none; pointer-events: none;
    }

    /* 가리기 활성화 시 투명도 0 (공간은 차지함) */
    body.hide-symbol .symbol,
    body.hide-ko-name .name-ko,
    body.hide-num .at-num,
    body.hide-mass .mass { opacity: 0 !important; }

    /* 물음표 등장 조건 */
    body.hide-symbol .element .question-mark,
    body.hide-ko-name .element .question-mark { display: block; }

    /* 까꿍(Peekaboo) 효과: 클릭 중일 때 정답 보이기 */
    .element:active .symbol, .element:active .name-ko, 
    .element:active .at-num, .element:active .mass { opacity: 1 !important; }
    .element:active .question-mark { display: none !important; }


    /* === 4. 팝업(Modal) 공통 스타일 === */
    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); z-index: 998; display: none;
        backdrop-filter: blur(3px);
    }
    .overlay.show { display: block; }

    .popup-base {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        background: white; padding: 25px; border-radius: 20px;
        z-index: 999; display: none; flex-direction: column; gap: 15px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        opacity: 0; transition: all 0.3s;
        max-height: 90vh; overflow-y: auto;
    }
    .popup-base.show { display: flex; transform: translate(-50%, -50%) scale(1); opacity: 1; }

    .close-popup-btn {
        position: absolute; top: 15px; right: 15px;
        background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999;
    }
    
    .control-title { font-size: 1.2rem; margin-bottom: 5px; font-weight: bold; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    
    .toggle-btn {
        width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px;
        background: white; font-family: 'Jua'; font-size: 1rem; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
    }
    .toggle-btn.active { background: #ff6b6b; color: white; border-color: #ff6b6b; }
    .toggle-btn::after { content: "OFF"; color: #ccc; font-size: 0.8rem; }
    .toggle-btn.active::after { content: "ON"; color: white; }

    /* === 5. 연금술사(Alchemy) & 애니메이션 === */
    @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    .lab-bench {
        background: #f4f4f4; border-radius: 15px; padding: 20px;
        display: flex; gap: 20px; justify-content: center; align-items: flex-end;
    }
    .lab-beaker {
        width: 180px; height: 160px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(220,240,255,0.8));
        border: 4px solid #bdc3c7; border-top: none;
        border-radius: 0 0 30px 30px;
        position: relative; display: flex; flex-wrap: wrap; 
        align-content: flex-end; justify-content: center; padding: 10px; gap: 5px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    .collection-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        gap: 8px; background: #eee; padding: 10px; border-radius: 10px;
        max-height: 120px; overflow-y: auto;
    }
    .collect-item {
        height: 60px; background: #ccc; border-radius: 8px;
        display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
        filter: grayscale(100%); opacity: 0.5; transition: all 0.3s; cursor: pointer;
    }
    .collect-item.found {
        background: white; filter: grayscale(0%); opacity: 1;
        border: 2px solid #f1c40f; transform: scale(1.05);
    }

    /* === 6. 인쇄 최적화 === */
    @media print {
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: white; padding: 0; }
        header, .controls, .popup-base, .overlay, #quizToast, .legend { display: none !important; }
        .table-container { transform: scale(0.95); margin-top: 20px; border: none; box-shadow: none; }
        .element { border: 1px solid #000 !important; break-inside: avoid; box-shadow: none !important; }
        .symbol, .name-ko, .at-num, .mass { opacity: 1 !important; color: black !important; display: block !important; }
        .question-mark { display: none !important; }
        body::before {
            content: "✨ 나만의 원소 주기율표 ✨";
            display: block; text-align: center; font-size: 24pt; font-weight: bold; margin-bottom: 10px; width: 100%;
        }
    }
    
    /* 퀴즈 정답/오답 스타일 */
    .choice-btn {
        width: 100%; padding: 12px; margin: 5px 0; border: 2px solid #eee;
        background: white; border-radius: 10px; font-family: 'Jua'; font-size: 1.1rem;
        cursor: pointer; text-align: left; transition: all 0.2s; position: relative;
    }
    .choice-btn:hover:not(:disabled) { background: #f9f9f9; transform: translateX(5px); }
    .choice-btn.correct { background: #d4edda; border-color: #c3e6cb; color: #155724; }
    .choice-btn.wrong { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    
    .quiz-answer-reveal {
        margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 10px; font-size: 0.9rem; color: #555;
    }
</style>
</head>
<body>

<header>
    <h1>🚀 신나는 원소 탐험 <span class="secret-btn" onclick="openSettings()" title="설정">⚙️</span></h1>
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="원소 이름, 기호 찾기...">
        <button class="btn primary" onclick="openQuiz()">🧩 퀴즈 도전</button>
        <button class="btn alchemy" onclick="openAlchemy()">⚗️ 실험실</button>
        <button class="btn" onclick="window.print()">🖨️ 인쇄</button>
    </div>
</header>

<div class="table-container" id="periodicTable"></div>

<div class="legend">
    <div><span class="dot bg-s"></span>s-블록</div>
    <div><span class="dot bg-d"></span>d-블록</div>
    <div><span class="dot bg-p"></span>p-블록</div>
    <div><span class="dot bg-f"></span>f-블록</div>
</div>

<div class="overlay" id="overlay" onclick="closeAllPopups()"></div>

<div class="controls-container popup-base" id="settingsPopup">
    <button class="close-popup-btn" onclick="closeAllPopups()">✕</button>
    <div class="control-title">📝 학습용 빈칸 설정</div>
    
    <button class="toggle-btn" onclick="toggleMode(this, 'hide-symbol')">원소 기호 가리기</button>
    <button class="toggle-btn" onclick="toggleMode(this, 'hide-ko-name')">한글 이름 가리기</button>
    <button class="toggle-btn" onclick="toggleMode(this, 'hide-mass')">원자 질량 가리기</button>
    <button class="toggle-btn" onclick="toggleMode(this, 'hide-num')">원자 번호 가리기</button>
    <p style="font-size:0.8rem; color:#999; text-align:center; margin:0;">* 가려진 곳을 꾹 누르면 정답이 보여요!</p>
</div>

<div class="popup-base" id="wikiModal" style="width: 400px; text-align: center;">
    <button class="close-popup-btn" onclick="closeAllPopups()">✕</button>
    <div id="wikiContent"></div>
</div>

<div class="popup-base" id="quizModal" style="width: 500px;">
    <button class="close-popup-btn" onclick="closeAllPopups()">✕</button>
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px;">
        <h3 style="margin:0;">🧩 원소 퀴즈왕</h3>
        <select id="quizLevel" class="search-box" style="width: auto; padding:5px;" onchange="resetQuiz()">
             <option value="easy">초급 (1~20번 + 주요 원소)</option> 
             <option value="hard">고급 (설명 보고 맞히기)</option>
        </select>
    </div>
    <div class="quiz-score" style="margin-top:10px; font-size:0.9rem;">
        점수: <b id="scoreVal" style="color:#6c5ce7; font-size:1.2rem;">0</b>
        <span id="comboBadge" style="background:#ff7675; color:white; padding:2px 8px; border-radius:10px; font-size:0.8rem; display:none; margin-left:5px;">🔥 3연속!</span>
    </div>
    <div id="quizArea" style="margin-top:15px;"></div>
    <button class="btn primary" id="nextBtn" style="width:100%; margin-top:15px; justify-content:center; display:none;" onclick="nextQuestion()">다음 문제 ▶</button>
</div>

<div class="popup-base" id="alchemyPopup" style="min-width: 600px; background: #fffdf5;">
    <button class="close-popup-btn" onclick="closeAlchemy()">✕</button>
    <div style="display:flex; justify-content:space-between; border-bottom:2px solid #eee; padding-bottom:10px;">
        <h3 style="margin:0; color:#d35400;">⚗️ 꼬마 연금술사</h3>
        <span style="color:#777;">도감: <b id="foundCount" style="color:#d35400;">0</b> / 14</span>
    </div>
    <p style="text-align:center; color:#666; font-size:0.9rem; margin:10px 0;">
        주기율표에서 원소를 클릭해 비커에 넣고 <b>가열</b>해보세요!<br>
        (예: 수소 2개 + 산소 1개 = ?)
    </p>

    <div class="lab-bench">
        <div class="lab-beaker" id="beaker">
            <div style="position: absolute; top: -25px; color:#aaa; font-size:0.8rem; width:100%; text-align:center;">🧪 반응 용기</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="btn alchemy" onclick="mixElements()" style="height:60px; font-size:1.2rem;">🔥 가열하기</button>
            <button class="btn" onclick="clearBeaker()">비우기 🗑️</button>
        </div>
        <div id="resultArea" style="width:140px; height:140px; border:3px dashed #ccc; border-radius:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:white;">
            <span style="font-size:2rem; opacity:0.3;">✨</span>
            <span style="font-size:0.8rem; color:#aaa;">결과물</span>
        </div>
    </div>

    <div style="margin-top:15px;">
        <div style="font-size:0.9rem; font-weight:bold; color:#555; margin-bottom:5px;">📖 발견한 화합물 도감</div>
        <div class="collection-grid" id="collectionGrid"></div>
    </div>
</div>

  23: "바나듐은 강철을 더 단단하고 질기게 만들어줘요. 공구와 자동차 부품에 섞어서 사용해요. 일부 생물의 몸에도 소량 들어있답니다.",
  
  24: "크로뮴은 반짝반짝 빛나는 은색 금속이에요. 수도꼭지와 자동차 범퍼를 반짝이게 코팅하는 데 사용해요. 스테인리스 강철을 만드는 중요한 재료예요.",
  
  25: "망가니즈는 건전지와 강철을 만드는 데 꼭 필요해요. 알루미늄 캔을 단단하게 만들어줘요. 우리 몸에도 소량 필요한 원소랍니다.",
  
  26: "철은 지구에서 가장 많이 사용되는 금속이에요. 건물, 다리, 자동차, 못을 만들어요. 우리 몸의 피(헤모글로빈)에도 들어있어서 산소를 운반해준답니다.",
  
  27: "코발트는 아름다운 파란색을 내는 금속이에요. 충전 배터리와 강력한 자석을 만드는 데 사용해요. 도자기와 유리에 파란색을 입히는 데도 쓰인답니다.",
  
  28: "니켈은 동전을 만드는 데 사용되는 금속이에요. 스테인리스 강철에 섞어서 녹슬지 않게 해줘요. 충전 배터리에도 들어있답니다.",
  
  29: "구리는 전기가 아주 잘 통하는 금속이에요. 전선, 동전, 냄비를 만드는 데 사용해요. 시간이 지나면 초록색으로 변하는데, 이것을 녹청이라고 해요.",
  
  30: "아연은 철이 녹슬지 않도록 보호하는 코팅 재료예요. 건전지를 만들고, 우리 몸의 면역 체계에도 필요해요. 상처가 빨리 낫도록 도와주기도 한답니다.",
  
  31: "갈륨은 손 위에 올려놓으면 녹아버리는 신기한 금속이에요. 녹는점이 약 30℃로 아주 낮아요. LED 조명과 스마트폰 부품을 만드는 데 사용된답니다.",
  
  32: "게르마늄은 반도체를 만드는 데 사용되는 원소예요. 컴퓨터와 광섬유 통신에 쓰여요. 규소와 비슷한 성질을 가지고 있답니다.",
  
  33: "비소는 독성이 있어서 아주 조심해야 하는 원소예요. 옛날 이야기에 독약으로 자주 나와요. 지금은 반도체와 일부 약을 만드는 데 조심스럽게 사용해요.",
  
  34: "셀레늄은 복사기와 태양전지에 사용되는 원소예요. 빛을 받으면 전기가 잘 통하는 특별한 성질이 있어요. 우리 몸에도 소량 필요한 영양소랍니다.",
  
  35: "브로민은 상온에서 액체인 몇 안 되는 원소 중 하나예요. 붉은 갈색을 띠고 냄새가 강해요. 불이 잘 붙지 않게 하는 난연제를 만드는 데 사용된답니다.",
  
  36: "크립톤은 밝은 조명과 레이저를 만드는 기체예요. 카메라 플래시에도 사용돼요. 슈퍼맨의 고향 행성 이름이기도 하답니다!",
  
  37: "루비듐은 물과 만나면 폭발적으로 반응하는 금속이에요. 아주 정밀한 시계를 만드는 데 사용해요. 실험실에서 아주 조심스럽게 다뤄야 해요.",
  
  38: "스트론튬은 불꽃놀이에서 빨간색을 만들어내요. 뼈를 튼튼하게 하는 연구에도 사용돼요. 야광 시계에도 옛날에 쓰였답니다.",
  
  39: "이트륨은 TV와 컴퓨터 화면을 밝게 만들어줘요. 강력한 레이저를 만드는 데도 사용해요. LED 조명의 재료이기도 하답니다.",
  
  40: "지르코늄은 아주 높은 온도에도 견디는 금속이에요. 원자력 발전소의 연료봉을 감싸는 데 사용해요. 인공 다이아몬드(큐빅 지르코니아)를 만들기도 해요.",
  
  41: "나이오븀은 강철을 더욱 강하게 만들어줘요. 초전도 자석과 로켓 엔진에 사용돼요. MRI 기계의 중요한 부품이기도 하답니다.",
  
  42: "몰리브데넘은 아주 높은 온도에서도 녹지 않는 금속이에요. 강철을 단단하게 만들고, 전구 필라멘트를 지지하는 데 사용해요. 공구와 기계 부품에도 쓰인답니다.",
  
  43: "테크네튬은 자연에서 거의 발견되지 않는 인공 원소예요. 병원에서 몸속을 검사하는 의료 영상에 사용돼요. 방사선을 내지만 금방 사라져서 안전해요.",
  
  44: "루테늄은 아주 단단하고 귀한 금속이에요. 컴퓨터 하드디스크와 전자부품을 만드는 데 사용해요. 백금과 섞으면 더욱 단단해져서 특수 장비에 쓰인답니다.",
  
  45: "로듐은 세상에서 가장 비싼 금속 중 하나예요. 자동차 배기가스를 깨끗하게 만드는 촉매 변환기에 사용돼요. 은색 장신구를 더 반짝이게 코팅하는 데도 쓰인답니다.",
  
  46: "팔라듐은 자동차 배기가스를 정화하는 데 꼭 필요한 금속이에요. 수소를 저장하는 특별한 능력이 있어요. 치과 치료와 전자제품에도 사용된답니다.",
  
  47: "은은 반짝반짝 빛나는 귀한 금속이에요. 장신구와 동전을 만들고, 전기가 가장 잘 통하는 금속이에요. 세균을 죽이는 능력이 있어서 항균 제품에도 쓰인답니다.",
  
  48: "카드뮴은 충전 배터리에 사용되었지만 독성이 있어요. 지금은 사용을 줄이고 있어요. 노란색 물감과 일부 태양전지를 만드는 데 조심스럽게 사용된답니다.",
  
  49: "인듐은 스마트폰과 태블릿 화면을 터치할 수 있게 해주는 원소예요. 투명하면서도 전기가 통하는 특별한 성질이 있어요. LCD와 LED 화면에 꼭 필요한 재료랍니다.",
  
  50: "주석은 깡통(양철)을 만드는 데 사용되는 금속이에요. 철이 녹슬지 않도록 코팅해줘요. 땜납을 만들어서 전자제품을 연결하는 데도 쓰인답니다.",
  
  51: "안티모니는 물건이 불에 잘 타지 않게 만드는 난연제로 사용돼요. 배터리와 반도체를 만드는 데도 쓰여요. 옛날에는 화장품과 약으로도 사용되었답니다.",
  
  52: "텔루륨은 태양전지와 DVD를 만드는 데 사용되는 원소예요. 반도체 성질을 가지고 있어요. 강철에 섞으면 가공하기 쉬워진답니다.",
  
  53: "아이오딘은 상처를 소독하는 빨간 약(포비돈)에 들어있어요. 우리 몸의 갑상선이 제대로 일하는 데 꼭 필요해요. 소금에 첨가되어 건강을 지켜준답니다.",
  
  54: "제논은 자동차의 밝은 헤드라이트를 만드는 기체예요. 마취제로도 사용되고, 우주선 엔진에도 쓰여요. 공기 중에 아주 조금만 들어있는 귀한 기체랍니다.",
  
  55: "세슘은 세상에서 가장 정확한 원자시계를 만드는 데 사용돼요. 1초를 정의하는 기준이 되는 원소예요. 물과 만나면 폭발적으로 반응하는 위험한 금속이랍니다.",
  
  56: "바륨은 병원에서 위와 장을 X-ray로 검사할 때 마시는 하얀 액체의 재료예요. 불꽃놀이에서 초록색을 만들어내요. 진흙 속에서 석유를 찾는 데도 도움을 준답니다.",
  
  57: "란타넘은 카메라와 망원경 렌즈를 더 선명하게 만들어줘요. 충전 배터리의 성능을 높이는 데도 사용돼요. 희토류 원소 중 하나랍니다.",
  
  58: "세륨은 라이터의 부싯돌에 들어있어서 불꽃을 쉽게 만들어줘요. 자동차 배기가스를 깨끗하게 하는 촉매로도 사용돼요. 유리를 연마하는 데도 쓰인답니다.",
  
  59: "프라세오디뮴은 용접할 때 눈을 보호하는 고글을 만드는 데 사용돼요. 강력한 자석의 재료이기도 해요. 아름다운 초록색 유리를 만드는 데도 쓰인답니다.",
  
  60: "네오디뮴은 세상에서 가장 강력한 영구자석을 만드는 원소예요. 헤드폰, 스피커, 전기자동차 모터에 들어있어요. 레이저를 만드는 데도 사용된답니다.",
  
  61: "프로메튬은 자연에서 거의 발견되지 않는 방사성 원소예요. 야광 시계와 두께 측정 장비에 사용돼요. 인공적으로만 만들 수 있는 희귀한 원소랍니다.",
  
  62: "사마륨은 강력한 자석과 레이저를 만드는 데 사용되는 원소예요. 암 치료 연구에도 쓰여요. 헤드폰과 전기 기타의 픽업에 들어있는 자석의 재료랍니다.",
  
  63: "유로퓸은 TV와 형광등에서 빨간색 빛을 만들어내는 원소예요. 유로 지폐의 위조 방지 잉크에도 사용돼요. LED 조명의 색을 조절하는 데도 쓰인답니다.",
  
  64: "가돌리늄은 병원의 MRI 검사를 더 선명하게 만들어주는 조영제예요. 강력한 자석 성질을 가지고 있어요. 원자로를 제어하는 데도 사용된답니다.",
  
  65: "터븀은 형광등과 TV 화면에서 초록색 빛을 만들어내요. 강력한 자석을 만드는 데도 사용돼요. 지폐의 위조 방지 기술에도 쓰인답니다.",
  
  66: "디스프로슘은 전기자동차와 풍력발전기의 자석을 더 강하게 만들어줘요. 높은 온도에서도 자석 성질을 유지해요. 원자로를 제어하는 데도 사용된답니다.",
  
  67: "홀뮴은 자연에서 가장 강한 자기적 성질을 가진 원소예요. 레이저 수술 장비에 사용돼요. 원자로에서 중성자를 흡수하는 역할도 한답니다.",
  
  68: "어븀은 광섬유 케이블로 인터넷 신호를 멀리 보내는 데 사용돼요. 분홍색 유리와 선글라스를 만드는 데도 쓰여요. 레이저 피부 치료에도 사용된답니다.",
  
  69: "툴륨은 휴대용 X-ray 장비를 만드는 데 사용되는 원소예요. 레이저 수술 도구에도 쓰여요. 희토류 원소 중에서 가장 비싼 원소 중 하나랍니다.",
  
  70: "이터븀은 원자시계와 레이저를 만드는 데 사용되는 원소예요. 스테인리스 강철의 성질을 개선하는 데도 쓰여요. 지진을 감지하는 장비에도 들어있답니다.",
  
  71: "루테튬은 암을 진단하고 치료하는 의료 영상에 사용돼요. PET 스캔 장비의 중요한 부품이에요. 희토류 원소 중 가장 무겁고 단단한 원소랍니다.",
  
  72: "하프늄은 아주 높은 온도에도 견디는 금속이에요. 로켓 노즐과 원자로 제어봉을 만드는 데 사용돼요. 컴퓨터 칩의 성능을 높이는 데도 쓰인답니다.",
  
  73: "탄탈럼은 스마트폰과 노트북의 작은 축전기를 만드는 데 꼭 필요해요. 인공 관절과 뼈 이식 재료로도 사용돼요. 산에도 녹지 않는 강한 금속이랍니다.",
  
  74: "텅스텐은 모든 금속 중에서 녹는점이 가장 높은 원소예요(3,422℃). 전구의 필라멘트와 용접 전극을 만들어요. 휴대폰 진동 모터의 무게추로도 사용된답니다.",
  
  75: "레늄은 제트엔진과 로켓 엔진의 고온 부품을 만드는 데 사용돼요. 아주 비싸고 희귀한 금속이에요. 촉매로 석유를 정제하는 데도 쓰인답니다.",
  
  76: "오스뮴은 자연에서 가장 무거운 원소예요(밀도가 가장 높아요). 만년필 펜촉과 전기 접점을 만드는 데 사용돼요. 아주 단단하지만 부서지기 쉬운 금속이랍니다.",
  
  77: "이리듐은 6,600만 년 전 공룡을 멸종시킨 운석에서 많이 발견됐어요. 만년필 펜촉과 자동차 점화 플러그를 만들어요. 부식에 아주 강한 귀한 금속이랍니다.",
  
  78: "백금은 아주 귀하고 반짝이는 금속이에요. 결혼반지와 자동차 촉매 변환기를 만들어요. 화학 실험 도구와 암 치료 약물에도 사용된답니다.",
  
  79: "금은 반짝이고 절대 녹슬지 않는 귀한 금속이에요. 장신구와 동전을 만들고, 스마트폰과 컴퓨터 부품에도 들어있어요. 전기가 아주 잘 통하고 영원히 변하지 않는답니다.",
  
  80: "수은은 상온에서 액체인 유일한 금속이에요. 옛날 온도계에 사용되었지만 독성이 있어서 지금은 사용을 줄이고 있어요. 형광등 안에도 아주 조금 들어있답니다.",
  
  81: "탈륨은 독성이 강해서 아주 조심해야 하는 원소예요. 옛날 쥐약으로 사용되었어요. 지금은 특수 유리와 의료 영상 검사에 조심스럽게 사용된답니다.",
  
  82: "납은 무겁고 부드러운 금속이에요. 옛날 배터리와 페인트에 사용되었지만 독성 때문에 지금은 사용을 줄이고 있어요. X-ray 차폐복과 낚시 추로 사용된답니다.",
  
  83: "비스무트는 비교적 안전한 중금속이에요. 배탈 약(펩토비스몰)의 주성분이에요. 아름다운 무지개색 결정을 만들고, 화장품과 합금에도 사용된답니다.",
  
  84: "폴로늄은 강한 방사선을 내는 위험한 원소예요. 우주선의 정전기를 제거하는 데 사용돼요. 마리 퀴리가 발견했고, 그녀의 조국 폴란드의 이름을 땄답니다.",
  
  85: "아스타틴은 자연에서 가장 희귀한 원소 중 하나예요. 지구 전체에 28g 정도만 존재해요. 암 치료 연구에 사용되지만 금방 사라지는 방사성 원소랍니다.",
  
  86: "라돈은 땅속에서 나오는 방사성 기체예요. 집 지하실에 쌓이면 건강에 해로울 수 있어요. 지진을 예측하는 연구에도 사용되는 무겁고 보이지 않는 기체랍니다.",

        if(name.length >= 6) return name.substring(0,3) + "<br>" + name.substring(3);
        return name;

    function formatAW(aw) {

    }

        // 1~18족, 7주기 좌표 매핑 (간이 로직)
        // 란타넘/악티늄은 하단(8,9행)으로 배치
        const getPos = (n) => {
            if(n==1) return [1,1]; if(n==2) return [1,18];
            if(n>=3 && n<=4) return [2, n-2]; if(n>=5 && n<=10) return [2, n+8];
            if(n>=11 && n<=12) return [3, n-10]; if(n>=13 && n<=18) return [3, n];
            if(n>=19 && n<=36) return [4, n-18];
            if(n>=37 && n<=54) return [5, n-36];
            if(n>=55 && n<=56) return [6, n-54];
            if(n>=57 && n<=71) return [8, n-53]; // 란타넘족
            if(n>=72 && n<=86) return [6, n-68];
            if(n>=87 && n<=88) return [7, n-86];
            if(n>=89 && n<=103) return [9, n-85]; // 악티늄족
            if(n>=104 && n<=118) return [7, n-100];
            return [10,1];
        };

        ALL.forEach(e => {
            const card = createCard(e);
            const [r, c] = getPos(e.n);
            card.style.gridRow = r;
            card.style.gridColumn = c;
            mainGrid.appendChild(card);
        });
        
        // 라벨 추가
        addLabel(6, 3, "57-71<br>란타넘족");
        addLabel(7, 3, "89-103<br>악티늄족");
        addLabel(8, 3, "란타넘족 👉", "justify-content:flex-end; padding-right:10px; border:none; background:none; font-weight:bold;");
        addLabel(9, 3, "악티늄족 👉", "justify-content:flex-end; padding-right:10px; border:none; background:none; font-weight:bold;");
    }
    
    function addLabel(r, c, html, style="") {
        const div = document.createElement('div');
        div.className = 'label-cell';
        div.style.gridRow = r; div.style.gridColumn = c;
        div.innerHTML = html;
        if(style) div.style.cssText += style;
        mainGrid.appendChild(div);
    }

    // 상세 정보 (위키)
    function showWiki(e) {
        const content = document.getElementById('wikiContent');
        const desc = ELEMENT_DESC[e.n] || "아직 상세 설명이 없지만 신비한 원소랍니다!";
        
        content.innerHTML = `
            <div class="card-symbol bg-${e.b}" style="margin:0 auto 15px auto;">${e.s}</div>
            <h2 style="margin:0;">${e.ko} (${e.n}번)</h2>
            <p style="color:#777; font-size:1.1rem; margin-top:5px;">원자량: ${formatAW(e.aw)}</p>
            <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin-top:15px; line-height:1.5; text-align:left;">
                ${desc}
            </div>
        `;
        openPopup('wikiModal');
    }
    
    /* =========================================
       3. 팝업 및 공통 기능
       ========================================= */
    function openPopup(id) {
        document.getElementById('overlay').classList.add('show');
        document.getElementById(id).classList.add('show');
    }
    
    function closeAllPopups() {
        document.querySelectorAll('.popup-base, .overlay').forEach(el => el.classList.remove('show'));
    }

    function toggleMode(btn, className) {
        const isActive = document.body.classList.toggle(className);
        if(isActive) btn.classList.add('active'); else btn.classList.remove('active');
    }
    function openSettings() { openPopup('settingsPopup'); }


    /* =========================================
       4. 퀴즈 시스템 (업그레이드)
       ========================================= */
    function openQuiz() {
        quizState.score = 0; quizState.combo = 0;
        document.getElementById('scoreVal').innerText = 0;
        openPopup('quizModal');
        nextQuestion();
    }

    function nextQuestion() {
        const qArea = document.getElementById('quizArea');
        qArea.innerHTML = '';
        document.getElementById('nextBtn').style.display = 'none';
        
        // 난이도 설정
        const level = document.getElementById('quizLevel').value;
        let pool = ALL;
        if(level === 'easy') pool = ALL.filter(e => e.n<=20 || [26,29,47,79,80].includes(e.n));
        else pool = ALL.filter(e => ELEMENT_DESC[e.n]); // 설명 있는 것만

        const answer = pool[Math.floor(Math.random() * pool.length)];
        quizState.currentAnswer = answer;
        
        // 문제 유형 (기호 맞히기 vs 이름 맞히기 vs 설명 보고 맞히기)
        let type = 'symbol';
        if(level === 'hard') type = 'desc';
        else type = Math.random() > 0.5 ? 'symbol' : 'name';

        // 질문 생성
        const qTitle = document.createElement('div');
        qTitle.style.textAlign = 'center';
        qTitle.style.fontSize = '1.3rem';
        
        if(type === 'desc') {
            const desc = ELEMENT_DESC[answer.n].replace(answer.ko, 'OO').replace(answer.s, 'X');
            qTitle.innerHTML = `<span style="font-size:1rem; color:#666;">다음 설명에 맞는 원소는?</span><br>"${desc}"`;
        } else if(type === 'symbol') {
            qTitle.innerHTML = `<span style="font-size:3rem; font-weight:bold; color:#6c5ce7;">${answer.s}</span><br>이 기호의 원소 이름은?`;
        } else {
            qTitle.innerHTML = `<span style="font-size:1.5rem; font-weight:bold;">${answer.ko}</span><br>이 원소의 기호는?`;
        }
        qArea.appendChild(qTitle);

        // 보기 생성
        let choices = [answer];
        while(choices.length < 4) {
            const wrong = ALL[Math.floor(Math.random() * ALL.length)];
            if(!choices.includes(wrong)) choices.push(wrong);
        }
        choices.sort(() => Math.random() - 0.5);

        choices.forEach((c, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            
            // 보기 텍스트
            let label = type === 'symbol' || type === 'desc' ? c.ko : c.s;
            btn.innerHTML = `<span style="color:#aaa; margin-right:10px;">${idx+1}</span> ${label}`;
            
            btn.onclick = () => checkAnswer(c, btn);
            qArea.appendChild(btn);
        });
    }

    function checkAnswer(choice, btn) {
        if(btn.disabled) return;
        const answer = quizState.currentAnswer;
        
        if(choice.n === answer.n) {
            // 정답
            btn.classList.add('correct');
            btn.innerHTML += " 🎉";
            quizState.score += (10 + quizState.combo * 2);
            quizState.combo++;
            document.getElementById('scoreVal').innerText = quizState.score;
            
            if(quizState.combo >= 2) {
                const badge = document.getElementById('comboBadge');
                badge.style.display = 'inline-block';
                badge.innerText = `🔥 ${quizState.combo}연속!`;
            }
            
            // 버튼 잠금 및 다음 문제 버튼
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            document.getElementById('nextBtn').style.display = 'flex';
        } else {
            // 오답
            btn.classList.add('wrong');
            btn.disabled = true;
            quizState.combo = 0;
            document.getElementById('comboBadge').style.display = 'none';
            
            // 힌트 (토스트)
            showToast(`앗! 틀렸어요. 힌트: ${answer.n}번 원소예요!`);
        }
    }

    /* =========================================
       5. 연금술사 (Alchemy) 게임
       ========================================= */
    function openAlchemy() {
        alchemyState.mix = [];
        updateBeakerUI();
        renderCollection();
        openPopup('alchemyPopup');
    }
    function closeAlchemy() { closeAllPopups(); }

    function addToBeaker(el) {
        if(alchemyState.mix.length >= 6) {
            showToast("비커가 꽉 찼어요! 🔥 버튼을 누르세요.");
            return;
        }
        
        alchemyState.mix.push(el.s);
        
        // 애니메이션 효과 원소 생성
        const ball = document.createElement('div');
        ball.innerText = el.s;
        ball.className = `bg-${el.b}`; // 배경색 활용
        ball.style.cssText = `
            width:40px; height:40px; border-radius:50%;
            display:flex; justify-content:center; align-items:center; font-weight:bold;
            border:2px solid white; box-shadow:0 3px 5px rgba(0,0,0,0.2);
            animation: float 3s infinite ease-in-out;
        `;
        document.getElementById('beaker').appendChild(ball);
    }

    function clearBeaker() {
        alchemyState.mix = [];
        updateBeakerUI();
        const res = document.getElementById('resultArea');
        res.innerHTML = '<span style="font-size:2rem; opacity:0.3;">✨</span><span style="font-size:0.8rem; color:#aaa;">결과물</span>';
        res.style.border = '3px dashed #ccc';
        res.style.background = 'white';
    }

    function updateBeakerUI() {
        const beaker = document.getElementById('beaker');
        beaker.innerHTML = '<div style="position: absolute; top: -25px; color:#aaa; font-size:0.8rem; width:100%; text-align:center;">🧪 반응 용기</div>';
    }

    function mixElements() {
        const key = alchemyState.mix.sort().join(',');
        const resultDiv = document.getElementById('resultArea');
        
        if(recipes[key]) {
            // 성공
            const item = recipes[key];
            if(!alchemyState.discovered.has(key)) {
                alchemyState.discovered.add(key);
                showToast(`🎉 새로운 발견! [${item.name}]`);
                renderCollection();
            }
            
            resultDiv.style.border = `3px solid ${item.color}`;
            resultDiv.style.background = '#fff';
            resultDiv.innerHTML = `
                <div style="font-size:3rem; animation:bounce 0.5s;">${item.icon}</div>
                <div style="font-size:0.9rem; font-weight:bold; margin-top:5px; color:#333;">${item.name}</div>
            `;
            createParticles(resultDiv); 
        } else {
            // 실패
            showToast("음... 아무 반응이 없네요.");
            resultDiv.innerHTML = '<div>💨 펑!</div>';
            document.getElementById('beaker').style.animation = 'shake 0.4s';
            setTimeout(() => document.getElementById('beaker').style.animation = '', 400);
        }
    }

    function renderCollection() {
        const grid = document.getElementById('collectionGrid');
        const countSpan = document.getElementById('foundCount');
        grid.innerHTML = '';
        let count = 0;
        
        for(const [key, val] of Object.entries(recipes)) {
            const isFound = alchemyState.discovered.has(key);
            if(isFound) count++;
            
            const div = document.createElement('div');
            div.className = `collect-item ${isFound ? 'found' : ''}`;
            div.innerHTML = val.icon;
            div.title = isFound ? val.name : "???";
            div.onclick = () => { if(isFound) showToast(val.desc); };
            grid.appendChild(div);
        }
        countSpan.innerText = count;
    }

    // 폭죽 파티클 효과
    function createParticles(target) {
        const rect = target.getBoundingClientRect();
        for(let i=0; i<15; i++) {
            const p = document.createElement('div');
            p.style.cssText = `
                position:fixed; width:8px; height:8px; background:gold; border-radius:50%;
                top:${rect.top+50}px; left:${rect.left+50}px; pointer-events:none; z-index:2000;
                transition: transform 0.8s, opacity 0.8s;
            `;
            document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            const dist = 60 + Math.random() * 40;
            setTimeout(() => {
                p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                p.style.opacity = 0;
            }, 10);
            setTimeout(() => p.remove(), 800);
        }
    }

    // 알림 메시지 (Toast)
    function showToast(msg) {
        let t = document.getElementById('toast');
        if(!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.style.cssText = 'position:fixed; bottom:15%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:12px 24px; border-radius:30px; z-index:3000; transition:opacity 0.3s; font-size:1rem; box-shadow:0 5px 15px rgba(0,0,0,0.2);';
            document.body.appendChild(t);
        }
        t.innerText = msg;
        t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2500);
    }

    // 초기화 실행
    window.onload = () => {
        renderTable();
    };
</script>
