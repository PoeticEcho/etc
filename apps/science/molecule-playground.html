    const MISSIONS = [
      {
        formula: 'H₂O (물)',
        desc: '수소(H) 2개와 산소(O) 1개를 결합하여 물 분자를 만드세요. 자연스럽게 굽어진 결합각을 확인해 보세요.',
        check: (atoms, bonds) => {
          const counts = countAtoms(atoms);
          if (counts.H !== 2 || counts.O !== 1 || atoms.length !== 3) return false;
          return checkAllBondsSatisfied(atoms, bonds);
        }
      },
      {
        formula: 'CH₄ (메탄)',
        desc: '탄소(C) 1개와 수소(H) 4개를 결합하여 메탄 분자를 만드세요. 수소들이 서로 최대한 멀어지며 안정적인 구조를 찾습니다.',
        check: (atoms, bonds) => {
          const counts = countAtoms(atoms);
          if (counts.C !== 1 || counts.H !== 4 || atoms.length !== 5) return false;
          return checkAllBondsSatisfied(atoms, bonds);
        }

        formula: 'NH₃ (암모니아)',

        check: (atoms, bonds) => {
          const counts = countAtoms(atoms);
          if (counts.N !== 1 || counts.H !== 3 || atoms.length !== 4) return false;
          return checkAllBondsSatisfied(atoms, bonds);
        }
      },
      {
        formula: 'O₂ (산소 분자)',
        desc: '산소(O) 2개를 이중 결합으로 연결하여 산소 분자를 만드세요. 단일 결합 후 결합 선을 한 번 더 클릭하면 이중 결합으로 바뀝니다.',
        check: (atoms, bonds) => {
          const counts = countAtoms(atoms);
          if (counts.O !== 2 || atoms.length !== 2) return false;
          const ooBond = bonds.find(b => b.atom1.type === 'O' && b.atom2.type === 'O');
          if (!ooBond) return false;
          if ((ooBond.order || 1) < 2) return false;
          return checkAllBondsSatisfied(atoms, bonds);
        }

        formula: 'HCl (염화수소)',

        }

        formula: 'H₂S (황화수소)',

      H3P: { name: '포스핀 (Phosphine)', displayFormula: 'PH₃', desc: '포스핀은 인과 수소가 결합한 기체 화합물로, 일부 산업 공정과 연구에서 사용됩니다.' },
      H3PO3: { name: '인아산', displayFormula: 'H₃PO₃', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      H4ClN: { name: '염화암모늄', displayFormula: 'NH₄Cl', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      H8N2O4S: { name: '황산암모늄', displayFormula: '(NH₄)₂SO₄', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      HCl: { name: '염화수소 (Hydrogen Chloride)', displayFormula: 'HCl', desc: '염화수소는 수소와 염소가 결합한 기체로, 수용액 상태에서는 강산인 염산으로 알려져 있습니다.' },

      HNO2: { name: '아질산', displayFormula: 'HNO₂', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      HNO3: { name: '질산', displayFormula: 'HNO₃', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      N2: { name: '질소', displayFormula: 'N₂', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      N2O: { name: '아산화질소', displayFormula: 'N₂O', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      NO: { name: '일산화질소', displayFormula: 'NO', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      NO2: { name: '이산화질소', displayFormula: 'NO₂', desc: '교과서와 실생활에서 자주 등장하는 대표적인 화합물입니다.' },
      O2: { name: '산소 분자 (Oxygen)', displayFormula: 'O₂', desc: '산소 분자는 생명 활동에 필수적인 기체로, 두 개의 산소 원자가 이중 결합을 이루고 있습니다.' }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const simulationStatus = document.getElementById('statusSimulation');

    let atoms = [];
    let bonds = [];
    let draggingAtom = null;
    let clusterDrag = null;
    let clusterDragOffsets = new Map();
    let didClusterDrag = false;
    let lastMousePos = null;
    let currentMissionIndex = 0;
    let isMissionComplete = false;
    let isRelaxing = false;

    // --- 클래스 ---

    class Atom {
      constructor(type, x, y) {
        this.id = Date.now() + Math.random();
        this.type = type;
        this.x = x;
        this.y = y;
        const props = ATOM_PROPERTIES[type];
        this.color = props.color;
        this.maxBonds = props.maxBonds;
        this.radius = BASE_RADIUS * props.ratio;
        this.vx = 0;
        this.vy = 0;
        this.mass = this.radius;
      }
      get bondCount() {
        return bonds.reduce((acc, b) => {
          if (b.atom1 === this) return acc + (b.order || 1);
          if (b.atom2 === this) return acc + (b.order || 1);
          return acc;
        }, 0);
      }
      get remainingBonds() {
        return this.maxBonds - this.bondCount;
      }
      get neighbors() {
        return bonds
          .filter(b => b.atom1 === this || b.atom2 === this)
          .map(b => (b.atom1 === this ? b.atom2 : b.atom1));
      }
    }

    // --- 헬퍼 ---

    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
      };
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function calculateIdealBondDistance(a1, a2) {
      return (a1.radius + a2.radius) * BOND_MARGIN_FACTOR;
    }

    function getIdealBondAngle(center, neighborCount) {
      const t = center.type;
      if (t === 'C') {
        if (neighborCount === 4) return 109.5 * Math.PI / 180;
        if (neighborCount === 3) return 120 * Math.PI / 180;
        if (neighborCount === 2) return Math.PI;
      }
      if (t === 'N') {
        if (neighborCount === 3) return 107 * Math.PI / 180;
        if (neighborCount === 4) return 109.5 * Math.PI / 180;
        if (neighborCount === 2) return Math.PI;
      }
      if (t === 'O' || t === 'S') {
        if (neighborCount === 2) return 104.5 * Math.PI / 180;
      }
      if (t === 'P') {
        if (neighborCount === 3) return 93 * Math.PI / 180;
        if (neighborCount === 4) return 109.5 * Math.PI / 180;
      }
      if (neighborCount >= 2) return (2 * Math.PI) / neighborCount;
      return 0;
    }

    function checkAllBondsSatisfied(currentAtoms, currentBonds, options = {}) {
      const { requireFullValence = true } = options;
      if (currentAtoms.length === 0) return false;
      for (const atom of currentAtoms) {
        if (atom.remainingBonds < 0) return false;
        if (requireFullValence && atom.remainingBonds !== 0) return false;
      }
      return true;
    }

    function countAtoms(arr) {
      return arr.reduce((c, a) => {
        c[a.type] = (c[a.type] || 0) + 1;
        return c;
      }, {});
    }

    function pointLineDistance(px, py, x1, y1, x2, y2) {
      const lineSq = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (lineSq === 0) {
        const dx = px - x1;
        const dy = py - y1;
        return Math.sqrt(dx * dx + dy * dy);
      }
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / lineSq;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      const dx = px - projX;
      const dy = py - projY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getConnectedClusters() {
      const clusters = [];
      const visited = new Set();
      atoms.forEach(atom => {
        if (!visited.has(atom)) {
          const cluster = [];
          const stack = [atom];
          visited.add(atom);
          while (stack.length) {
            const current = stack.pop();
            cluster.push(current);
            current.neighbors.forEach(neigh => {
              if (!visited.has(neigh)) {
                visited.add(neigh);
                stack.push(neigh);
              }
            });
          }
          clusters.push(cluster);
        }
      });
      return clusters;
    }

    function getClusterFromAtom(startAtom) {
      if (!startAtom) return [];
      const cluster = [];
      const visited = new Set();
      const stack = [startAtom];
      visited.add(startAtom);
      while (stack.length) {
        const current = stack.pop();
        cluster.push(current);
        current.neighbors.forEach(neigh => {
          if (!visited.has(neigh)) {
            visited.add(neigh);
            stack.push(neigh);
          }
        });
      }
      return cluster;
    }

    function computeFormula(cluster) {
      const counts = {};
      cluster.forEach(atom => {
        counts[atom.type] = (counts[atom.type] || 0) + 1;
      });
      const parts = [];
      if (counts.C) parts.push('C' + (counts.C > 1 ? counts.C : ''));
      if (counts.H) parts.push('H' + (counts.H > 1 ? counts.H : ''));
      Object.keys(counts).sort().forEach(k => {
        if (k !== 'C' && k !== 'H') {
          const c = counts[k];
          parts.push(k + (c > 1 ? c : ''));
        }
      });
      return parts.join('');
    }

    // --- 드로잉 ---

    function draw() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bonds.forEach(drawBond);
      atoms.forEach(a => drawAtom(a));

      if (draggingAtom) drawAtom(draggingAtom, true);

      const clusters = getConnectedClusters();
      clusters.forEach(cluster => {
        if (cluster.length === 0) return;
        const formula = computeFormula(cluster);
        const data = MOLECULE_DATA[formula];
        const label = data ? data.name : formula;
        drawMoleculeTag(cluster, label);
      });
    }

    function drawMoleculeTag(cluster, label) {
      if (!cluster || cluster.length === 0) return;
      let minX = Infinity, minY = Infinity;
      let maxX = -Infinity, maxY = -Infinity;
      cluster.forEach(atom => {
        const left = atom.x - atom.radius;
        const right = atom.x + atom.radius;
        const top = atom.y - atom.radius;
        const bottom = atom.y + atom.radius;
        if (left < minX) minX = left;
        if (right > maxX) maxX = right;
        if (top < minY) minY = top;
        if (bottom > maxY) maxY = bottom;
      });
      const centerX = (minX + maxX) / 2;
      const tagY = minY - 10;

      ctx.font = 'bold 14px Inter, sans-serif';
      const textWidth = ctx.measureText(label).width;
      const padding = 4;
      const rectWidth = textWidth + padding * 2;
      const rectHeight = 18;
      const rectX = centerX - rectWidth / 2;
      const rectY = tagY - rectHeight;

      ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
      ctx.fillRect(rectX, rectY, rectWidth, rectHeight);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, centerX, rectY + rectHeight / 2);
    }

    function drawBond(bond) {
      const { atom1, atom2 } = bond;
      const order = bond.order || 1;

      const x1 = atom1.x, y1 = atom1.y;
      const x2 = atom2.x, y2 = atom2.y;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt(dx * dx + dy * dy);
      const nx = -dy / length;
      const ny = dx / length;

      const offset = 7;

      for (let i = 0; i < order; i++) {
        let offsetMult;
        if (order % 2 === 1) {
          offsetMult = (i - Math.floor(order / 2)) * offset;
        } else {
          offsetMult = (i - (order / 2) + 0.5) * offset;
        }
        ctx.beginPath();
        ctx.moveTo(x1 + nx * offsetMult, y1 + ny * offsetMult);
        ctx.lineTo(x2 + nx * offsetMult, y2 + ny * offsetMult);
        ctx.strokeStyle = '#666666';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

    function drawAtom(atom, isDragging = false) {
      ctx.beginPath();
      ctx.arc(atom.x, atom.y, atom.radius, 0, Math.PI * 2);
      ctx.fillStyle = isDragging ? atom.color + 'A0' : atom.color;
      ctx.fill();

      ctx.strokeStyle = isDragging ? '#333333' : '#111111';
      ctx.lineWidth = isDragging ? 2 : 3;
      ctx.stroke();

      const fontSize = Math.max(12, Math.min(24, Math.floor(atom.radius * 0.7)));
      ctx.font = `bold ${fontSize}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = isDragging ? '#333333' : '#ffffff';
      ctx.fillText(atom.type, atom.x, atom.y);

      const indicatorRadius = Math.max(4, Math.floor(atom.radius * 0.15));
      const indicatorX = atom.x + atom.radius * Math.cos(-Math.PI / 4);
      const indicatorY = atom.y + atom.radius * Math.sin(-Math.PI / 4);

      const remaining = atom.remainingBonds;
      if (remaining > 0) {
        ctx.beginPath();
        ctx.arc(indicatorX, indicatorY, indicatorRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.fill();

        ctx.font = `bold ${Math.max(8, Math.floor(indicatorRadius * 1.5))}px Inter, sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(remaining, indicatorX, indicatorY);
      } else if (remaining < 0) {
        ctx.beginPath();
        ctx.arc(indicatorX, indicatorY, indicatorRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();

        ctx.font = `bold ${Math.max(8, Math.floor(indicatorRadius * 1.5))}px Inter, sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('!', indicatorX, indicatorY);
      }

      if (draggingAtom && !isRelaxing) {
        const idealDist = calculateIdealBondDistance(atom, draggingAtom);
        const maxSnapDist = idealDist * SNAP_RANGE_FACTOR;
        if (dist(atom, draggingAtom) < maxSnapDist) {
          ctx.beginPath();
          ctx.arc(atom.x, atom.y, maxSnapDist, 0, Math.PI * 2);
          ctx.strokeStyle = '#cccccc';
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 5]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    // --- 물리 시뮬레이션 ---

    function applyForces() {
      if (atoms.length === 0) return 0;

      const forces = new Map();
      atoms.forEach(atom => forces.set(atom, { fx: 0, fy: 0 }));

      // 척력
      for (let i = 0; i < atoms.length; i++) {
        for (let j = i + 1; j < atoms.length; j++) {
          const a = atoms[i];
          const b = atoms[j];
          const d = dist(a, b);
          const minSep = a.radius + b.radius;

          if (d < canvas.width / 5 && d > 1) {
            const angle = Math.atan2(b.y - a.y, b.x - a.x);
            let f = REPULSION_CONSTANT / (d * d);
            if (d < minSep) f *= 2;

            const fx = f * Math.cos(angle);
            const fy = f * Math.sin(angle);

            const fa = forces.get(a);
            const fb = forces.get(b);
            fa.fx -= fx;
            fa.fy -= fy;
            fb.fx += fx;
            fb.fy += fy;
          }
        }
      }

      // 결합 인력
      bonds.forEach(bond => {
        const a = bond.atom1;
        const b = bond.atom2;
        const d = dist(a, b);
        const ideal = calculateIdealBondDistance(a, b);
        const f = STIFFNESS * (d - ideal) * (bond.order || 1);
        const angle = Math.atan2(b.y - a.y, b.x - a.x);

        const fx = f * Math.cos(angle);
        const fy = f * Math.sin(angle);

        const fa = forces.get(a);
        const fb = forces.get(b);
        fa.fx += fx;
        fa.fy += fy;
        fb.fx -= fx;
        fb.fy -= fy;
      });

      // 결합각 제약
      atoms.forEach(center => {
        const neighbors = center.neighbors;
        if (neighbors.length < 2) return;
        const ideal = getIdealBondAngle(center, neighbors.length);
        if (!ideal) return;

        for (let i = 0; i < neighbors.length; i++) {
          for (let j = i + 1; j < neighbors.length; j++) {
            const a = neighbors[i];
            const b = neighbors[j];

            const ux = a.x - center.x;
            const uy = a.y - center.y;
            const vx = b.x - center.x;
            const vy = b.y - center.y;

            const uLen = Math.sqrt(ux * ux + uy * uy);
            const vLen = Math.sqrt(vx * vx + vy * vy);
            if (uLen === 0 || vLen === 0) continue;

            const uxn = ux / uLen, uyn = uy / uLen;
            const vxn = vx / vLen, vyn = vy / vLen;

            let dot = uxn * vxn + uyn * vyn;
            dot = Math.max(-1, Math.min(1, dot));
            const angle = Math.acos(dot);
            const delta = ideal - angle;

            if (delta > ANGLE_TOLERANCE) {
              const mag = ANGLE_STIFFNESS * delta;
              const abx = b.x - a.x;
              const aby = b.y - a.y;
              const abLen = Math.sqrt(abx * abx + aby * aby) || 1;
              const abxN = abx / abLen;
              const abyN = aby / abLen;

              const fa = forces.get(a);
              const fb = forces.get(b);
              fa.fx -= mag * abxN;
              fa.fy -= mag * abyN;
              fb.fx += mag * abxN;
              fb.fy += mag * abyN;
            }
          }
        }
      });

      // 속도·위치 업데이트
      let totalKE = 0;
      atoms.forEach(atom => {
        const f = forces.get(atom);
        atom.vx += f.fx / atom.mass;
        atom.vy += f.fy / atom.mass;

        atom.vx *= DAMPING;
        atom.vy *= DAMPING;

        atom.x += atom.vx;
        atom.y += atom.vy;

        if (atom.x < atom.radius) { atom.x = atom.radius; atom.vx *= -1; }
        if (atom.x > canvas.width - atom.radius) { atom.x = canvas.width - atom.radius; atom.vx *= -1; }
        if (atom.y < atom.radius) { atom.y = atom.radius; atom.vy *= -1; }
        if (atom.y > canvas.height - atom.radius) { atom.y = canvas.height - atom.radius; atom.vy *= -1; }

        totalKE += atom.vx * atom.vx + atom.vy * atom.vy;
      });

      return totalKE;
    }

    function relaxLayout(minIter = MIN_SIMULATION_STEPS, maxIter = MAX_SIMULATION_STEPS) {
      if (isRelaxing || atoms.length <= 1) {
        updateInfoPanel();
        draw();
        return;
      }
      isRelaxing = true;
      simulationStatus.classList.remove('hidden');

      let step = 0;
      function loop() {
        if (!draggingAtom) {
          const ke = applyForces();
          draw();
          step++;
          const stable = step > minIter && ke < STABILITY_THRESHOLD;
          const maxed = step >= maxIter;
          if (stable || maxed) {
            isRelaxing = false;
            simulationStatus.classList.add('hidden');
            updateInfoPanel();
            return;
          }
          requestAnimationFrame(loop);
        } else {
          isRelaxing = false;
          simulationStatus.classList.add('hidden');
          updateInfoPanel();
        }
      }
      loop();
    }

    // --- 로직 ---

    function snapAndBond(movingAtom, candidateAtoms = atoms) {
      if (!movingAtom || candidateAtoms.length === 0) return;

      let bestTarget = null;
      let bestDist = Infinity;

      for (const atom of candidateAtoms) {
        if (atom === movingAtom) continue;
        const ideal = calculateIdealBondDistance(atom, movingAtom);
        const maxSnap = ideal * SNAP_RANGE_FACTOR;
        const d = dist(atom, movingAtom);

        if (d <= maxSnap && d < bestDist &&
            atom.remainingBonds > 0 && movingAtom.remainingBonds > 0) {
          bestDist = d;
          bestTarget = atom;
        }
      }

      if (!bestTarget) return;

      const angle = Math.atan2(movingAtom.y - bestTarget.y, movingAtom.x - bestTarget.x);
      const ideal = calculateIdealBondDistance(bestTarget, movingAtom);
      movingAtom.x = bestTarget.x + Math.cos(angle) * ideal;
      movingAtom.y = bestTarget.y + Math.sin(angle) * ideal;

      let existing = bonds.find(
        b => (b.atom1 === bestTarget && b.atom2 === movingAtom) ||
             (b.atom2 === bestTarget && b.atom1 === movingAtom)
      );
      if (existing) {
        const avail = Math.min(bestTarget.remainingBonds, movingAtom.remainingBonds);
        if (existing.order < 3 && avail > 0) existing.order += 1;
      } else {
        bonds.push({ atom1: bestTarget, atom2: movingAtom, order: 1 });
      }
    }

    function finalizeDraggingAtom() {
      if (!draggingAtom) return;
      atoms.push(draggingAtom);
      atoms.forEach(a => { a.vx = 0; a.vy = 0; });
      snapAndBond(draggingAtom);
      draggingAtom = null;
      relaxLayout();
    }

    function deleteAtom(atomToDelete) {
      if (!atomToDelete) return;
      atoms = atoms.filter(a => a !== atomToDelete);
      bonds = bonds.filter(b => b.atom1 !== atomToDelete && b.atom2 !== atomToDelete);
      relaxLayout(5, 80);
    }

    // --- UI 업데이트 ---

    function generatePalette() {
      const palette = document.getElementById('palette');
      palette.innerHTML = `
        <h3>원소 팔레트</h3>
        <p class="text-xs text-gray-500 mb-4">
          원자를 드래그하여 배치하세요.<br>
          배치된 원자를 더블클릭하면 삭제됩니다.
        </p>
      `;
      const fragment = document.createDocumentFragment();
      for (const type in ATOM_PROPERTIES) {
        const props = ATOM_PROPERTIES[type];
        const btn = document.createElement('button');
        btn.className = 'atom-btn';
        btn.setAttribute('data-type', type);
        btn.innerHTML = `
          <span class="symbol">${type}</span>
          <span class="max-bonds">(${props.maxBonds}개 결합)</span>
        `;
        btn.addEventListener('mousedown', e => {
          e.preventDefault();
          isRelaxing = false;
          simulationStatus.classList.add('hidden');
          const t = btn.getAttribute('data-type');
          const pos = getMousePos(e);
          draggingAtom = new Atom(t, pos.x, pos.y);
          draw();
        });
        fragment.appendChild(btn);
      }
      palette.appendChild(fragment);
    }

    function updateStatusPanel() {
      const statusList = document.getElementById('statusList');
      statusList.innerHTML = '';

      const totalAtoms = atoms.length;
      const totalBonds = bonds.length;
      const clusters = getConnectedClusters();
      const stable = totalAtoms > 0 && checkAllBondsSatisfied(atoms, bonds);

      function add(text) {
        const li = document.createElement('li');
        li.className = 'status-item';
        li.textContent = text;
        statusList.appendChild(li);
      }

      add(`원자 수: ${totalAtoms}`);
      add(`결합 수: ${totalBonds}`);
      add(`분자(클러스터) 개수: ${clusters.length}`);
      add(stable ? '모든 원자의 결합수가 안정 상태입니다.' :
                   '아직 일부 원자의 결합수가 부족하거나 많습니다.');
    }

    function updateMoleculeInfoPanel() {
      const panel = document.getElementById('moleculeInfoPanel');
      panel.innerHTML = '';

      const clusters = getConnectedClusters();
      const infos = clusters
        .filter(c => c.length > 0)
        .map(c => ({ cluster: c, formula: computeFormula(c) }))
        .sort((a, b) => a.formula.localeCompare(b.formula));

      infos.forEach((info, idx) => {
        const { cluster, formula } = info;
        const container = document.createElement('div');
        container.style.marginBottom = '0.5rem';

        const title = document.createElement('div');
        title.style.fontWeight = '600';
        const data = MOLECULE_DATA[formula];
        const displayFormula = data && data.displayFormula ? data.displayFormula : formula;
        title.textContent = `분자 ${idx + 1}: ${displayFormula}`;
        container.appendChild(title);

        const descDiv = document.createElement('div');
        if (data) {
          descDiv.innerHTML = `<strong>${data.name}</strong><br>${data.desc}`;
        } else {
          descDiv.textContent = '알려지지 않은 분자입니다. 이성질체나 특이한 구조일 수 있어요.';
        }
        descDiv.style.fontSize = '0.85rem';
        descDiv.style.color = '#334155';
        container.appendChild(descDiv);

        panel.appendChild(container);
      });
    }

    function updateInfoPanel() {
      updateStatusPanel();
      updateMoleculeInfoPanel();
      checkMissionCompletion();
    }

    function setMission(index) {
      const missionTitle = document.getElementById('missionTitle');
      const missionDesc = document.getElementById('missionDesc');
      const mission = MISSIONS[index];
      if (!mission) return;
      currentMissionIndex = index;
      missionTitle.textContent = `미션 ${index + 1}: ${mission.formula}`;
      missionDesc.textContent = mission.desc;
      isMissionComplete = false;
      document.getElementById('missionCompleteMessage').style.display = 'none';
      document.getElementById('nextMissionBtn').disabled = true;
    }

    function checkMissionCompletion() {
      const mission = MISSIONS[currentMissionIndex];
      if (!mission) return;
      const overlay = document.getElementById('missionCompleteMessage');
      const nextBtn = document.getElementById('nextMissionBtn');
      const success = mission.check(atoms, bonds);
      if (success) {
        isMissionComplete = true;
        overlay.style.display = 'block';
        nextBtn.disabled = false;
      } else {
        isMissionComplete = false;
        overlay.style.display = 'none';
        nextBtn.disabled = true;
      }
    }

    function nextMission() {
      const nextIndex = (currentMissionIndex + 1) % MISSIONS.length;
      resetBoard();
      setMission(nextIndex);
      draw();
      updateInfoPanel();
    }

    function resetBoard() {
      atoms = [];
      bonds = [];
      draggingAtom = null;
      clusterDrag = null;
      clusterDragOffsets = new Map();
      didClusterDrag = false;
      lastMousePos = null;
      isRelaxing = false;
      simulationStatus.classList.add('hidden');
      document.getElementById('missionCompleteMessage').style.display = 'none';
      draw();
      updateInfoPanel();
    }

    function cycleBondOrder(bond) {
      const current = bond.order || 1;
      let next = current + 1;
      if (next > 3) next = 1;
      bond.order = next;
    }

    // --- 이벤트 리스너 ---

    function setupEventListeners() {
      const nextMissionBtn = document.getElementById('nextMissionBtn');
      const resetBoardBtn = document.getElementById('resetBoardBtn');

      canvas.addEventListener('mousedown', e => {
        if (draggingAtom) return;
        const pos = getMousePos(e);
        lastMousePos = pos;

        let target = null;
        for (const atom of atoms) {
          if (dist(atom, pos) <= atom.radius) {
            target = atom;
            break;
          }
        }
        if (!target) {
          clusterDrag = null;
          clusterDragOffsets = new Map();
          return;
        }

        const cluster = getClusterFromAtom(target);
        clusterDrag = cluster;
        clusterDragOffsets = new Map();
        cluster.forEach(a => {
          clusterDragOffsets.set(a, { dx: a.x - pos.x, dy: a.y - pos.y });
          a.vx = 0;
          a.vy = 0;
        });
        didClusterDrag = false;
      });

      canvas.addEventListener('mousemove', e => {
        const pos = getMousePos(e);
        if (draggingAtom) {
          draggingAtom.x = pos.x;
          draggingAtom.y = pos.y;
          draw();
        } else if (clusterDrag) {
          if (lastMousePos && !didClusterDrag) {
            if (Math.abs(pos.x - lastMousePos.x) > 2 ||
                Math.abs(pos.y - lastMousePos.y) > 2) {
              didClusterDrag = true;
            }
          }
          clusterDrag.forEach(atom => {
            const offset = clusterDragOffsets.get(atom);
            if (!offset) return;
            atom.x = pos.x + offset.dx;
            atom.y = pos.y + offset.dy;
          });
          draw();
        }
      });

      function endDragging() {
        if (draggingAtom) {
          finalizeDraggingAtom();
        }
        if (clusterDrag) {
          const movedCluster = clusterDrag;
          clusterDrag = null;
          clusterDragOffsets = new Map();
          if (didClusterDrag) {
            const otherAtoms = atoms.filter(a => !movedCluster.includes(a));
            movedCluster.forEach(a => snapAndBond(a, otherAtoms));
            relaxLayout(5, 80);
          }
        }
      }

      canvas.addEventListener('mouseup', endDragging);
      document.addEventListener('mouseup', endDragging);

      canvas.addEventListener('dblclick', e => {
        const pos = getMousePos(e);
        for (const atom of atoms) {
          if (dist(atom, pos) <= atom.radius) {
            deleteAtom(atom);
            draw();
            updateInfoPanel();
            break;
          }
        }
      });

      canvas.addEventListener('click', e => {
        if (draggingAtom) return;
        if (didClusterDrag) {
          didClusterDrag = false;
          return;
        }
        if (e.detail !== 1) return;

        const pos = getMousePos(e);
        const threshold = 10;
        let clickedBond = null;
        for (const bond of bonds) {
          const d = pointLineDistance(
            pos.x, pos.y,
            bond.atom1.x, bond.atom1.y,
            bond.atom2.x, bond.atom2.y
          );
          if (d <= threshold) {
            clickedBond = bond;
            break;
          }
        }
        if (clickedBond) {
          cycleBondOrder(clickedBond);
          relaxLayout(5, 80);
        }
      });

      nextMissionBtn.addEventListener('click', nextMission);
      resetBoardBtn.addEventListener('click', () => {
        resetBoard();
        setMission(currentMissionIndex);
      });

      window.addEventListener('resize', draw);
    }

    // --- 초기화 ---

    (function init() {
      generatePalette();
      setMission(0);
      setupEventListeners();
      updateInfoPanel();
      draw();
    })();
  </script>
